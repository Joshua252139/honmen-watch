name: ur-watch

on:
  schedule:
    # 每10分钟一次，只在日本时间 6:00~24:00 运行（cron 用的是 UTC）
    - cron: "*/10 21-23,0-14 * * *"
  push:
    branches: [main]
    paths: ["ur/**", ".github/workflows/ur.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ur-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: ur-state
          key: ur-state-${{ github.run_id }}
          restore-keys: ur-state-

      - name: Check rooms
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 ur/watch.py 2>&1 | tee ur-run.log; exit ${PIPESTATUS[0]}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ur-state
          key: ur-state-${{ github.run_id }}

      - name: Publish debug
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r ur-debug ur-run.log /tmp/out/ 2>/dev/null || true
          date -u +%FT%TZ > /tmp/out/last_run.txt
          cd /tmp/out && git init -q -b ur-debug
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m "latest run"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ur-debug
